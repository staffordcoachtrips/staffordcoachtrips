<script>
fetch('data/trips.json')
    .then(response => {
        console.log("Response:", response);
        return response.json();
    })
    .then(trips => {
        console.log("Trips:", trips);

        const container = document.getElementById("trip-list");

        trips.forEach(trip => {
            container.innerHTML += `
                <h2>${trip.title}</h2>
                <p>${trip.category}</p>
                <img src="${trip.image}" width="300">
            `;
        });
    })
    .catch(error => {
        console.error("Error:", error);
    });
</script>
