<!doctype html>
<html lang="en-GB">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Welcome to Stafford Coach Trips. Discover comfortable coach travel from Stafford to attractions, events and memorable days out across the UK.">
  <meta name="theme-color" content="#24102f">
  <title>Stafford Coach Trips | Days Out from Stafford</title>

  <style>
    :root {
      --ink: #19151c;
      --muted: #665f6a;
      --plum-950: #24102f;
      --plum-900: #321142;
      --plum-700: #652a7d;
      --plum-100: #f1e8f5;
      --gold: #f4b942;
      --green: #157347;
      --paper: #fff;
      --wash: #f7f5f8;
      --line: #e6dfe9;
      --shadow: 0 18px 50px rgba(36, 16, 47, .13);
      --radius: 20px;
      --max: 1180px;
    }

    * { box-sizing: border-box; }
    html { scroll-behavior: smooth; }
    body { margin: 0; color: var(--ink); background: var(--wash); font: 16px/1.65 Arial, Helvetica, sans-serif; -webkit-font-smoothing: antialiased; }
    img { display: block; width: 100%; max-width: 100%; }
    a { color: inherit; }
    button, a { -webkit-tap-highlight-color: transparent; }
    :focus-visible { outline: 3px solid var(--gold); outline-offset: 3px; }
    .container { width: min(var(--max), calc(100% - 40px)); margin-inline: auto; }

    .skip-link { position: fixed; left: 16px; top: -80px; z-index: 9999; padding: 11px 16px; border-radius: 8px; color: var(--plum-950); background: #fff; font-weight: 800; }
    .skip-link:focus { top: 16px; }
    .topbar { padding: 7px 20px; color: #fff; background: var(--plum-950); text-align: center; font-size: 14px; }
    .topbar a { color: #ffe3a7; font-weight: 800; }

    .site-header { position: sticky; top: 0; z-index: 1000; background: rgba(255,255,255,.96); border-bottom: 1px solid rgba(50,17,66,.1); backdrop-filter: blur(14px); }
    .nav-wrap { min-height: 78px; display: flex; align-items: center; justify-content: space-between; gap: 24px; }
    .brand { display: flex; align-items: center; gap: 12px; color: var(--plum-950); text-decoration: none; font-size: 21px; font-weight: 900; letter-spacing: -.3px; }
    .brand-mark { display: grid; place-items: center; width: 44px; height: 44px; border-radius: 12px; color: #fff; background: linear-gradient(135deg,var(--plum-700),var(--plum-950)); box-shadow: 0 7px 18px rgba(50,17,66,.24); }
    .nav-links { display: flex; align-items: center; gap: 4px; }
    .nav-links a { padding: 10px 11px; border-radius: 8px; color: #403745; text-decoration: none; font-weight: 700; }
    .nav-links a:hover, .nav-links a[aria-current="page"] { color: var(--plum-700); background: var(--plum-100); }
    .nav-links .nav-cta { margin-left: 7px; color: #fff; background: var(--plum-700); }
    .nav-links .nav-cta:hover { color: #fff; background: var(--plum-900); }
    .menu-button { display: none; padding: 10px 12px; border: 1px solid var(--line); border-radius: 9px; color: var(--plum-950); background: #fff; font: inherit; font-weight: 800; cursor: pointer; }

    .home-hero { position: relative; isolation: isolate; min-height: 650px; display: grid; align-items: center; overflow: hidden; color: #fff; background: linear-gradient(90deg,rgba(26,7,35,.94) 0%,rgba(43,10,62,.83) 48%,rgba(43,10,62,.36) 100%), url("https://images.unsplash.com/photo-1544620347-c4fd4a3d5957?auto=format&fit=crop&w=2000&q=86") center/cover no-repeat; }
    .home-hero::after { content: ""; position: absolute; z-index: -1; right: -7%; bottom: -230px; width: 610px; height: 430px; border-radius: 50%; background: rgba(244,185,66,.2); filter: blur(28px); }
    .eyebrow{
    display:inline-block;
    margin:0 0 18px;
    color:var(--gold);
    font-size:14px;
    font-weight:800;
    letter-spacing:1.6px;
    text-transform:uppercase;
}
    .hero-content {
    max-width: 720px;
    padding: 105px 0 125px;
    margin: 0 auto;
    text-align: center;
}
    .home-hero h1{
    margin:0;
    max-width:700px;
    margin-inline:auto;
    font-size:clamp(48px,7vw,78px);
    line-height:1.02;
    letter-spacing:-2.6px;
    font-weight:900;
}
