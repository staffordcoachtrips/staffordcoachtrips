<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Register Interest | Stafford Coach Trips</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    font-family:'Poppins',sans-serif;
    background:#f5f5f5;
    color:#333;
    line-height:1.6;
}

/* HEADER */

header{
    background:#5b2c83;
    color:#fff;
    padding:25px 40px;
    display:flex;
    justify-content:space-between;
    align-items:center;
    flex-wrap:wrap;
    box-shadow:0 3px 10px rgba(0,0,0,.2);
}

.logo h1{
    font-size:2rem;
}

.logo p{
    margin-top:5px;
    opacity:.9;
}

nav{
    display:flex;
    gap:20px;
    flex-wrap:wrap;
}

nav a{
    color:#fff;
    text-decoration:none;
    font-weight:600;
    transition:.3s;
}

nav a:hover{
    color:#ffd54f;
}

/* MAIN */

main{
    max-width:900px;
    margin:50px auto;
    padding:20px;
}

/* CARD */

.interest-card{
    background:#fff;
    border-radius:16px;
    padding:40px;
    box-shadow:0 10px 30px rgba(0,0,0,.12);
}

.interest-card h2{
    color:#5b2c83;
    margin-bottom:10px;
    font-size:2rem;
}

.intro{
    margin-bottom:35px;
    color:#666;
}

/* FORM */

.form-group{
    margin-bottom:22px;
}

.form-group label{
    display:block;
    margin-bottom:8px;
    font-weight:600;
}

.form-group input,
.form-group select,
.form-group textarea{
    width:100%;
    padding:14px;
    border:1px solid #ccc;
    border-radius:10px;
    font-size:16px;
    font-family:'Poppins',sans-serif;
    transition:.25s;
}

.form-group input:focus,
.form-group select:focus,
.form-group textarea:focus{
    border-color:#5b2c83;
    outline:none;
    box-shadow:0 0 8px rgba(91,44,131,.25);
}

.form-group textarea{
    resize:vertical;
}

/* READ ONLY DESTINATION */

#destinationDisplay{
    background:#f3eef8;
    font-weight:600;
}

/* CHECKBOX */

.checkbox{
    margin:25px 0;
    display:flex;
    align-items:flex-start;
    gap:10px;
}

.checkbox label{
    cursor:pointer;
}

/* BUTTON */

.submit-btn{
    width:100%;
    background:#5b2c83;
    color:#fff;
    border:none;
    padding:18px;
    border-radius:10px;
    font-size:18px;
    font-weight:600;
    cursor:pointer;
    transition:.3s;
}

.submit-btn:hover{
    background:#743ca4;
    transform:translateY(-2px);
}

/* FOOTER */

footer{
    background:#5b2c83;
    color:#fff;
    text-align:center;
    padding:25px;
    margin-top:50px;
}

/* MOBILE */

@media(max-width:768px){

header{
    text-align:center;
    justify-content:center;
}

nav{
    margin-top:20px;
    justify-content:center;
}

.interest-card{
    padding:25px;
}

.logo h1{
    font-size:1.6rem;
}

.interest-card h2{
    font-size:1.6rem;
}

.submit-btn{
    font-size:16px;
}

}
</style>

</head>

<body>

<header>

<div class="logo">

<h1>🚌 Stafford Coach Trips</h1>

<p>Comfortable • Reliable • Affordable</p>

</div>

<nav>

<a href="index.html">Home</a>
<a href="future-trips.html">Future Trips</a>
<a href="contact.html">Contact</a>

</nav>

</header>

<main>

<section class="interest-card">

<h2 id="pageTitle">Register your interest</h2>

<p class="intro">
Complete the form below and we'll let you know when tickets become available.
</p>

<form id="interestForm">

<!-- Hidden Destination -->

<input
type="hidden"
id="destination"
name="entry.156927159">

<div class="form-group">

<label>Destination</label>

<input
type="text"
id="destinationDisplay"
readonly>

</div>

<div class="form-group">

<label for="name">
Full Name
</label>

<input
type="text"
id="name"
name="entry.1765542719"
required>

</div>

<div class="form-group">

<label for="email">
Email Address
</label>

<input
type="email"
id="email"
name="entry.559309084"
required>

</div>

<div class="form-group">

<label for="mobile">
Mobile Number
</label>

<input
type="tel"
id="mobile"
name="entry.1210903387"
required>

</div>

<div class="form-group">

<label for="seats">
Number of Seats
</label>

<select
id="seats"
name="entry.844888857"
required>

<option value="">Select...</option>
<option>1</option>
<option>2</option>
<option>3</option>
<option>4</option>
<option>5</option>
<option>6+</option>

</select>

</div>

<div class="form-group">

<label for="pickup">

Preferred Pick-up Point

</label>

<select
id="pickup"
name="entry.1185049023"
required>

<option value="">Select...</option>

<option>
Rising Brook
</option>

<option>
Stafford Railway Station
</option>

<option>
Other
</option>

</select>

</div>

<div class="form-group">

<label for="comments">

Comments

</label>

<textarea
id="comments"
name="entry.1814354651"
rows="5"
placeholder="Anything you'd like us to know?"></textarea>

</div>

<div class="checkbox">

<label>

<input
type="checkbox"
required>

I understand this is only an expression of interest and not a confirmed booking.

</label>

</div>

<button type="submit" class="submit-btn">

Register Interest

</button>

</form>

</section>

</main>

<footer>

<p>

© 2026 Stafford Coach Trips

</p>

</footer>
<script>

// Read the destination from the URL
const params = new URLSearchParams(window.location.search);
const trip = params.get("trip") || "Future Trip";

// Update the page heading
document.getElementById("pageTitle").textContent =
    "Register your interest in " + trip;

// Display the destination
document.getElementById("destinationDisplay").value = trip;

// Hidden field sent to Google Forms
document.getElementById("destination").value = trip;


// Form Submission

document.getElementById("interestForm").addEventListener("submit", function(e){

    e.preventDefault();

    const form = this;

    const formData = new FormData(form);

    fetch(
        "https://docs.google.com/forms/d/e/1FAIpQLSdcbZDVEABn-YKMMn-DqB5HureluVURrwnCLg7scB1to6eE2Q/formResponse",
        {
            method: "POST",
            mode: "no-cors",
            body: formData
        }
    )
    .then(() => {

        window.location.href = "thankyou.html?trip=" + encodeURIComponent(trip);

    })
    .catch(() => {

        alert("Sorry, something went wrong. Please try again.");

    });

});

</script>
</body>

</html>
