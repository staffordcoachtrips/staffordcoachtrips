<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Register Interest | Stafford Coach Trips</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
body{font-family:Poppins,sans-serif;background:#f5f5f5;margin:0}
header,footer{background:#5b2c83;color:#fff;padding:20px}
header nav a{color:#fff;margin-right:15px;text-decoration:none}
main{max-width:850px;margin:30px auto;padding:20px}
.card{background:#fff;padding:30px;border-radius:14px;box-shadow:0 5px 15px rgba(0,0,0,.15)}
.form-group{margin-bottom:16px}
label{display:block;font-weight:bold;margin-bottom:6px}
input,select,textarea{width:100%;padding:10px;border:1px solid #ccc;border-radius:6px}
button{width:100%;padding:14px;background:#5b2c83;color:#fff;border:0;border-radius:8px;font-size:18px}
#otherPickupGroup{display:none}
</style>
</head>
<body>
<header><h1>🚌 Stafford Coach Trips</h1><nav><a href="index.html">Home</a><a href="future-trips.html">Future Trips</a><a href="contact.html">Contact</a></nav></header>
<main><div class="card">
<h2 id="pageTitle">Register your interest</h2>
<p>Complete the form below and we'll contact you if this trip goes on sale.</p>
<form id="interestForm"
      action="https://formsubmit.co/staffordcoachtrips@gmail.com"
      method="POST">

    <input type="hidden" name="_subject" value="New Future Trip Interest">
    <input type="hidden" name="_template" value="table">
    <input type="hidden" name="_captcha" value="false">
    <input type="hidden" id="destination" name="Destination">
<div class="form-group"><label>Full Name</label><input name="Full Name" required></div>
<div class="form-group"><label>Your Email</label><input type="email" name="_replyto" required></div>
<div class="form-group"><label>Mobile</label><input name="Mobile" required></div>
<div class="form-group"><label>Seats</label><select name="Seats" required><option value=''>Select...</option><option>1</option><option>2</option><option>3</option><option>4</option><option>5</option><option>6+</option></select></div>
<div class="form-group"><label>Pick-up</label><select id="pickup" name="Pickup"><option>Rising Brook</option><option>Stafford Railway Station</option><option>Other</option></select></div>
<div class="form-group" id="otherPickupGroup"><label>Other pick-up</label><input id="otherPickup" name="Other Pickup" placeholder="Enter your preferred pick-up location"></div>
<div class="form-group"><label>Comments</label><textarea id="comments" name="Comments"></textarea></div>
<p><label><input type="checkbox" name="Agreement" value="Yes" required> I understand this is not a booking.</label></p>
<button type="submit">Register Interest</button>
</form></div></main>
<footer>© 2026 Stafford Coach Trips</footer>
<script>
const trip=new URLSearchParams(location.search).get('trip')||'Future Trip';
document.getElementById('pageTitle').textContent='Register your interest in '+trip;
document.getElementById('destination').value=trip;
const pickup=document.getElementById('pickup');
pickup.onchange = () => {
    document.getElementById('otherPickupGroup').style.display =
        pickup.value === 'Other' ? 'block' : 'none';
};
    
</script>
</body></html>
