<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Thank You | Stafford Coach Trips</title>
<style>
body{
    font-family:Arial,sans-serif;
    text-align:center;
    background:#f5f5f5;
    padding:60px;
}
.box{
    max-width:700px;
    margin:auto;
    background:#fff;
    padding:40px;
    border-radius:12px;
    box-shadow:0 0 15px rgba(0,0,0,.15);
}
a{
    display:inline-block;
    margin-top:20px;
    padding:12px 24px;
    background:#5b2c83;
    color:white;
    text-decoration:none;
    border-radius:8px;
}
</style>
</head>

<body>

<div class="box">
<h1>✅ Thank you!</h1>

<h2 id="tripName"></h2>

<p>Your interest has been registered successfully.</p>

<p>If this trip goes on sale we'll contact you using the details you provided.</p>

<a href="future-trips.html">Return to Future Trips</a>

</div>

<script>
const trip = new URLSearchParams(location.search).get('trip') || "our future trip";
document.getElementById("tripName").textContent =
"Thank you for registering your interest in " + trip + ".";
</script>

</body>
</html>
